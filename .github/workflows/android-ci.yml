name: Android CI (APK Build & Optional Firebase Distribution)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_debug:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build_release:
    name: Build Release APK (signed)
    runs-on: ubuntu-latest
    needs: build_debug
    if: ${{ secrets.RELEASE_KEYSTORE_BASE64 && secrets.RELEASE_KEYSTORE_PASSWORD && secrets.RELEASE_KEY_ALIAS && secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Create signing gradle properties
        run: |
          echo "RELEASE_STORE_FILE=release.keystore" >> local-signing.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> local-signing.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> local-signing.properties
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> local-signing.properties

      - name: Build Release APK (signed)
        env:
          ORG_GRADLE_PROJECT_signingPropsFile: local-signing.properties
        run: |
          ./gradlew :app:assembleRelease -PsigningPropsFile=$ORG_GRADLE_PROJECT_signingPropsFile --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  distribute_firebase:
    name: Firebase App Distribution (optional)
    runs-on: ubuntu-latest
    needs: [ build_debug ]
    if: ${{ secrets.FIREBASE_TOKEN && secrets.FIREBASE_APP_ID_ANDROID }}

    steps:
      - name: Download Debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug-apk
          path: ./artifacts

      - name: Distribute to Firebase App Distribution (Debug)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ secrets.FIREBASE_GROUPS || 'testers' }}
          file: ./artifacts/app-debug.apk
          releaseNotes: |
            CI debug build from ${{ github.repository }}@${{ github.sha }} for branch ${{ github.ref_name }}

      # If Release APK is built, optionally prefer distributing that instead.
      - name: Try download Release APK artifact (optional)
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ./artifacts-release

      - name: Distribute to Firebase App Distribution (Release, if present)
        if: ${{ hashFiles('./artifacts-release/app-release.apk') != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: ${{ secrets.FIREBASE_GROUPS || 'testers' }}
          file: ./artifacts-release/app-release.apk
          releaseNotes: |
            CI release build from ${{ github.repository }}@${{ github.sha }} for branch ${{ github.ref_name }}
