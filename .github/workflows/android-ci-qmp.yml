name: Android CI (Quran Memorizer Plus)

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_qmp_debug:
    name: Build :quranmemorizerplus Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK (:quranmemorizerplus)
        run: ./gradlew :quranmemorizerplus:assembleDebug --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quranmemorizerplus-debug-apk
          path: quranmemorizerplus/build/outputs/apk/debug/quranmemorizerplus-debug.apk
          if-no-files-found: error
